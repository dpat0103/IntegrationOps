name: IntegrationOps validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check --select F,E9 app migrations scripts tests
      - run: ruff format --check app migrations scripts tests
      - run: pytest -q
      - run: python -m compileall -q app
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-core.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: e2e/playwright-report
  distributed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-core.txt
      - run: docker compose -p integrationops-ci up --build -d --wait
      - run: docker compose -p integrationops-ci exec -T api python -m scripts.distributed_smoke
      - run: docker compose -p integrationops-ci cp tests api:/app/tests
      - run: docker compose -p integrationops-ci exec -T -e POSTGRES_TEST_URL=postgresql+psycopg://integrationops:integrationops@postgres:5432/integrationops api python -m pytest -q tests/test_postgres.py
      - run: python -m scripts.restart_experiment --project integrationops-ci --env-file .env.example --base-url http://127.0.0.1:8000 --output /tmp/restart-experiment.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distributed-restart-experiment
          path: /tmp/restart-experiment.json
      - run: docker compose -p integrationops-ci logs --tail 100
        if: failure()
      - run: docker compose -p integrationops-ci down -v
        if: always()
