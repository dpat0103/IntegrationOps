services:
  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://integrationops:integrationops@postgres:5432/integrationops
      TASK_MODE: celery
      SCHEDULER_ENABLED: "false"
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      ENVIRONMENT: development
      DEMO_MODE: "true"
      # Server-controlled demo target. Celery workers can resolve the Compose
      # service name `api`; browsers never submit this private URL themselves.
      DEMO_INTEGRATION_URL: http://api:8000/simulator/status
      ALLOW_PRIVATE_ENDPOINTS: "false"
      INTEGRATION_SECRET_KEY: ${INTEGRATION_SECRET_KEY:-local-development-secret-change-me}
      AUTO_CREATE_SCHEMA: "false"
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    command: celery -A app.celery_app.celery_app worker --loglevel=INFO
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      api: {condition: service_healthy}

  beat:
    build: .
    command: celery -A app.celery_app.celery_app beat --loglevel=INFO
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      api: {condition: service_healthy}

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: integrationops
      POSTGRES_USER: integrationops
      POSTGRES_PASSWORD: integrationops
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integrationops -d integrationops"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on:
      api: {condition: service_healthy}

  grafana:
    image: grafana/grafana:12.1.0
    ports: ["3001:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: integrationops
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  postgres_data:
