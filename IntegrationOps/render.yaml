# Render Blueprint for the hosted portfolio deployment.
# The public site exposes the controlled demo while keeping general CRUD writes
# disabled. Background checks still run through Celery + Render Key Value.
envVarGroups:
  - name: integrationops-shared
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TASK_MODE
        value: celery
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: ALLOW_PRIVATE_ENDPOINTS
        value: "false"
      - key: PUBLIC_WRITE_ENABLED
        value: "false"
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: INTEGRATION_SECRET_KEY
        generateValue: true

services:
  - type: web
    name: integrationops-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    preDeployCommand: alembic upgrade head
    envVars:
      - fromGroup: integrationops-shared
      - key: DATABASE_URL
        fromDatabase:
          name: integrationops-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: integrationops-redis
          type: keyvalue
          property: connectionString

  - type: worker
    name: integrationops-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.celery_app.celery_app worker --loglevel=INFO
    envVars:
      - fromGroup: integrationops-shared
      - key: DATABASE_URL
        fromDatabase:
          name: integrationops-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: integrationops-redis
          type: keyvalue
          property: connectionString

  - type: worker
    name: integrationops-beat
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.celery_app.celery_app beat --loglevel=INFO
    envVars:
      - fromGroup: integrationops-shared
      - key: DATABASE_URL
        fromDatabase:
          name: integrationops-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: integrationops-redis
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: integrationops-redis
    ipAllowList: []

# Choose an appropriate paid Postgres plan before relying on this as a
# long-lived public portfolio deployment. Render's free Postgres instances
# expire after their free-life window.
databases:
  - name: integrationops-db
