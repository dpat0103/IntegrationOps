<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IntegrationOps</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin:0; background:#0b1020; color:#e8edf7; }
    .wrap { max-width:1180px; margin:0 auto; padding:32px 20px 60px; }
    h1 { font-size:30px; margin:0; }
    .sub { color:#96a0b5; margin-top:6px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; margin:26px 0; }
    .card, .panel { background:#12192b; border:1px solid #26304a; border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.15); }
    .card { padding:18px; }
    .label { color:#96a0b5; font-size:13px; }
    .value { font-size:28px; font-weight:700; margin-top:8px; }
    .panel { padding:18px; margin-top:18px; }
    .row { display:flex; justify-content:space-between; gap:14px; align-items:center; border-top:1px solid #25304a; padding:14px 0; }
    .row:first-child { border-top:0; }
    .status { font-size:12px; font-weight:700; letter-spacing:.05em; padding:5px 9px; border-radius:999px; }
    .HEALTHY { background:#123d2a; color:#7ce2a8; }
    .DEGRADED { background:#463510; color:#f3ca70; }
    .FAILED { background:#4b1820; color:#ff8d9b; }
    .UNKNOWN { background:#273149; color:#bbc6da; }
    button, select { background:#1a2238; border:1px solid #384562; color:#edf2ff; border-radius:8px; padding:9px 11px; }
    button { cursor:pointer; }
    button:hover { background:#202a45; }
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
    code { color:#b8c8ff; }
    .muted { color:#8d98af; font-size:13px; }
    .error { color:#ff9aa8; }
    @media (max-width:700px){ .row{align-items:flex-start; flex-direction:column;} }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>IntegrationOps</h1>
    <div class="sub">API reliability, incident detection, and failure simulation.</div>

    <div class="grid" id="overview"></div>

    <div class="panel">
      <div class="toolbar">
        <strong>Demo upstream</strong>
        <select id="mode">
          <option value="healthy">Healthy</option>
          <option value="slow">High latency</option>
          <option value="unauthorized">401 auth failure</option>
          <option value="rate_limit">429 rate limited</option>
          <option value="server_error">503 upstream failure</option>
          <option value="malformed">Malformed payload</option>
        </select>
        <button onclick="setMode()">Set failure mode</button>
        <button onclick="seedDemo()">Create demo integration</button>
        <span class="muted" id="simState"></span>
      </div>
      <div class="muted" style="margin-top:10px">Tip: create the demo integration, switch failure mode, then click “Run check” three times to open an incident. Switch back to Healthy and run twice to resolve it.</div>
    </div>

    <div class="panel">
      <strong>Integrations</strong>
      <div id="integrations" style="margin-top:8px"></div>
    </div>

    <div class="panel">
      <strong>Recent incidents</strong>
      <div id="incidents" style="margin-top:8px"></div>
    </div>
  </div>
<script>
async function json(url, opts={}) {
  const r = await fetch(url, opts);
  if (!r.ok && r.status !== 204) throw new Error(await r.text());
  return r.status === 204 ? null : r.json();
}
const fmt = v => v == null ? '—' : v;
async function refresh() {
  try {
    const [o, statuses, incidents, sim] = await Promise.all([
      json('/api/overview'), json('/api/status'), json('/api/incidents'), json('/api/simulator/state')
    ]);
    document.getElementById('overview').innerHTML = [
      ['Integrations',o.total_integrations], ['Healthy',o.healthy], ['Degraded',o.degraded], ['Down',o.down],
      ['Active incidents',o.active_incidents], ['24h availability',o.availability_24h == null ? '—' : o.availability_24h+'%'],
      ['Avg latency',o.avg_latency_ms_24h == null ? '—' : o.avg_latency_ms_24h+' ms'], ['P95 latency',o.p95_latency_ms_24h == null ? '—' : o.p95_latency_ms_24h+' ms']
    ].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('');

    document.getElementById('integrations').innerHTML = statuses.length ? statuses.map(s=>`
      <div class="row">
        <div><div><strong>${s.name}</strong> <span class="status ${s.status}">${s.status}</span></div>
        <div class="muted"><code>${s.endpoint}</code></div>
        <div class="muted">Latency: ${s.latency_ms == null ? '—' : s.latency_ms+' ms'} ${s.failure_type ? ' · <span class="error">'+s.failure_type+'</span>' : ''}</div></div>
        <button onclick="runCheck(${s.id})">Run check</button>
      </div>`).join('') : '<div class="muted">No integrations yet.</div>';

    document.getElementById('incidents').innerHTML = incidents.length ? incidents.slice(0,10).map(i=>`
      <div class="row"><div><strong>#${i.id}</strong> · Integration ${i.integration_id}<div class="muted">${i.cause || 'UNKNOWN'} · ${new Date(i.started_at).toLocaleString()}</div></div>
      <span class="status ${i.status === 'OPEN' ? 'FAILED' : 'HEALTHY'}">${i.status}</span></div>`).join('') : '<div class="muted">No incidents yet.</div>';

    document.getElementById('simState').textContent = `Current: ${sim.mode}`;
    document.getElementById('mode').value = sim.mode;
  } catch(e) { console.error(e); }
}
async function setMode(){
  const mode = document.getElementById('mode').value;
  await json('/api/simulator/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode,delay_seconds:4})});
  await refresh();
}
async function seedDemo(){
  try {
    await json('/api/integrations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      name:'Demo Upstream', endpoint:location.origin+'/simulator/status', expected_status:200, timeout_ms:1500,
      latency_threshold_ms:700, check_interval_seconds:60, expected_json_key:'status', expected_json_value:'healthy'
    })});
  } catch(e) { if (!String(e).includes('already exists')) alert(e); }
  await refresh();
}
async function runCheck(id){ await json('/api/integrations/'+id+'/check',{method:'POST'}); await refresh(); }
refresh(); setInterval(refresh,5000);
</script>
</body>
</html>
